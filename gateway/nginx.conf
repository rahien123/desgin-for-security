worker_processes 1;
events { worker_connections 1024; }

http {
    # Rate limiting: 10 req/s mỗi IP, không burst; vượt là trả 429
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    upstream user_service       { server user-service:3001; }
    upstream order_service      { server order-service:3002; }
    upstream aggregator_service { server aggregator-service:3003; }

    server {
        listen 80;
        limit_req zone=per_ip;

        # ---- JWT offloading: nginx hỏi aggregator-service (/_auth) trước khi cho request đi tiếp ----
        location = /_auth {
            internal;
            proxy_pass http://aggregator_service/_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # ---- Routing ----
        location ~ ^/users(/|$) {
            auth_request /_auth;
            auth_request_set $uid $upstream_http_x_user_id;
            proxy_set_header X-User-Id $uid;          # ghi đè mọi X-User-Id do client gửi
            proxy_pass http://user_service;
        }

        location ~ ^/orders(/|$) {
            auth_request /_auth;
            auth_request_set $uid $upstream_http_x_user_id;
            proxy_set_header X-User-Id $uid;
            proxy_pass http://order_service;
        }

        # ---- Aggregation ----
        location = /dashboard {
            auth_request /_auth;
            auth_request_set $uid $upstream_http_x_user_id;
            proxy_set_header X-User-Id $uid;
            proxy_pass http://aggregator_service;
        }

        location / { return 404; }
    }
}
