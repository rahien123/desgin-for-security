services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on: [minio]

  order-service:
    build: ./order-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002

  aggregator-service:
    build: ./aggregator-service
    environment:
      PORT: 3003
      JWT_SECRET: mysecret
    depends_on: [user-service, order-service]

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [user-service, order-service, aggregator-service]

volumes:
  minio-data: